<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>我的KTV</title>
    <meta name="description" content="网页版 KTV 包厢：点歌、原唱伴唱切换、升降调、麦克风混响回声、音准打分、录音，内置公版曲目并接入开源曲库与在线歌词库。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3Crect x='25' y='12' width='14' height='26' rx='7' fill='white'/%3E%3Cpath d='M18 30a14 14 0 0 0 28 0M32 44v8M24 52h16' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="room"></canvas>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="logo"></span><span class="room-name">我的KTV</span><span class="room-sub">包厢</span></div>
        <div class="top-right">
          <span class="mic-pill" id="micPill"><span class="dot"></span><span class="txt">麦克风未开</span><span class="meter"><i></i></span></span>
          <span class="clock tabular" id="clock"></span>
          <button class="icon-btn" id="btnFull" title="全屏 (F)"></button>
          <button class="icon-btn" id="btnSettings" title="设置"></button>
        </div>
      </header>

      <main class="stage">
        <div class="tv">
          <div class="tv-screen" id="tv">
            <div class="tv-bg"></div>
            <div class="tv-media" id="tvMedia"></div>
            <div class="tv-shade"></div>
            <div class="tv-top">
              <button class="now" id="nowBtn" title="歌曲选项"><span class="now-title">—</span><span class="now-artist"></span></button>
              <div class="next-up" id="nextUp"></div>
            </div>
            <div class="pitch-wrap"><canvas id="pitch"></canvas><div class="live-score tabular" id="liveScore"></div></div>
            <div class="lyrics" id="lyrics"></div>
            <div class="tv-idle" id="idle">
              <div class="idle-time tabular" id="idleClock"></div>
              <div class="idle-title">欢迎光临</div>
              <div class="idle-sub">点一首歌，今晚的舞台属于你</div>
              <div class="idle-acts"><button class="btn btn-primary" data-open="hot">开始点歌</button><button class="btn" data-open="builtin">试唱内置曲目</button><button class="btn" data-open="open">开源曲库</button></div>
            </div>
            <div class="tv-status" id="status"><div class="spinner"></div><span></span></div>
            <div class="tv-noacc" id="noacc"></div>
            <div class="tv-rating" id="rating"></div>
            <div class="tv-score" id="score"></div>
            <div class="tv-credit" id="credit"></div>
          </div>
          <div class="tv-progress">
            <span class="tabular" id="tCur">0:00</span>
            <div class="bar" id="bar"><i></i></div>
            <span class="tabular" id="tDur">0:00</span>
          </div>
        </div>
      </main>

      <nav class="dock" id="dock"></nav>
    </div>
    <aside class="book" id="book"></aside>
    <canvas id="fx"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
